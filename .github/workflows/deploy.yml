name: Build and Push Docker Image

on:
  push:
    branches:
      - main  # Скрипт срабатывает при пуше в ветку main
    paths-ignore:
        - '**.md'
        - 'docs/**'
        - 'screen/**'
  workflow_dispatch: # Позволяет запускать сборку вручную через интерфейс GitHub

env:
  REGISTRY: ghcr.io
  # Название образа будет соответствовать вашему репозиторию: ghcr.io/pushkinmazila2/swag-ui
  IMAGE_NAME: ${{ github.repository }} 

jobs:
  build-and-push:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write # Обязательно для возможности пуша в GitHub Packages

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      # 1. Настройка Docker Buildx для кэширования и продвинутой сборки
      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      # 2. Авторизация в GitHub Container Registry (GHCR)
      - name: Log in to the Container Registry
        uses: docker/login-action@v3
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      # 3. Генерация метаданных (автоматические теги: "latest" и SHA коммита)
      - name: Extract metadata (tags, labels) for Docker
        id: meta
        uses: docker/metadata-action@v5
        with:
          images: ${{ env.REGISTRY }}/${{ env.IMAGE_NAME }}
          tags: |
            type=raw,value=latest
            type=sha,format=short

      # 4. Сборка и публикация согласно параметрам вашего Dockerfile
      - name: Build and push Docker image
        uses: docker/build-push-action@v6
        with:
          context: .
          file: ./Dockerfile
          push: true
          tags: ${{ steps.meta.outputs.tags }}    # Исправлено: id заменено на steps
          labels: ${{ steps.meta.outputs.labels }} # Исправлено: id заменено на steps
          cache-from: type=gha
          cache-to: type=gha,mode=max
